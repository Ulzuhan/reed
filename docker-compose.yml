name: reed

services:
  api:
    image: ${REED_IMAGE:-ghcr.io/ulzuhan/reed:latest}
    build: .
    ports:
      # Loopback-only by default. Set a reverse proxy or edit this binding if
      # remote clients need access, and configure REED_API_KEY first.
      - "127.0.0.1:${REED_PORT:-8000}:8000"
    environment:
      REED_QDRANT_URL: http://qdrant:6333
      REED_PROFILE: ${REED_PROFILE:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REED_API_KEY: ${REED_API_KEY:-}
      # Only used when REED_PROFILE=local; points at the optional ollama service.
      REED_OLLAMA_BASE_URL: ${REED_OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - reed_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # Starlette's upload spool and Reed's staged copy can briefly coexist.
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no curl or wget — bash's /dev/tcp is what is available.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Fully local stack: `docker compose --profile ollama up`
  # Then pull the models once:
  #   docker compose exec ollama ollama pull qwen3.5:4b
  #   docker compose exec ollama ollama pull embeddinggemma
  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  reed_data:
  qdrant_storage:
  ollama_models:
