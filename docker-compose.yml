name: reed

services:
  api:
    image: ${REED_IMAGE:-ghcr.io/ulzuhan/reed:latest}
    build: .
    ports:
      # Loopback-only by default. Set a reverse proxy or edit this binding if
      # remote clients need access, and configure REED_API_KEY first.
      - "127.0.0.1:${REED_PORT:-8000}:8000"
    environment:
      - REED_PROFILE=${REED_PROFILE:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REED_OPENAI_CHAT_MODEL=${REED_OPENAI_CHAT_MODEL:-gpt-5-mini}
      - REED_OPENAI_EMBED_MODEL=${REED_OPENAI_EMBED_MODEL:-text-embedding-3-small}
      # Only used when REED_PROFILE=local; points at the optional ollama service.
      - REED_OLLAMA_BASE_URL=${REED_OLLAMA_BASE_URL:-http://ollama:11434}
      - REED_OLLAMA_CHAT_MODEL=${REED_OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      - REED_OLLAMA_EMBED_MODEL=${REED_OLLAMA_EMBED_MODEL:-embeddinggemma}
      - REED_EMBED_MODEL_DIGEST=${REED_EMBED_MODEL_DIGEST:-}
      - REED_EMBED_MODEL_REVISION=${REED_EMBED_MODEL_REVISION:-}
      - REED_EMBED_MODEL_QUANTIZATION=${REED_EMBED_MODEL_QUANTIZATION:-}
      # Bare entries preserve the distinction between unset (automatic preset)
      # and explicitly empty (prefix disabled).
      - REED_EMBED_QUERY_PREFIX
      - REED_EMBED_DOC_PREFIX
      - REED_QDRANT_URL=http://qdrant:6333
      - REED_QDRANT_API_KEY=${REED_QDRANT_API_KEY:-}
      - REED_COLLECTION=${REED_COLLECTION:-reed_chunks}
      - REED_TOP_K=${REED_TOP_K:-4}
      - REED_FETCH_K=${REED_FETCH_K:-20}
      - REED_RETRIEVAL_MODE=${REED_RETRIEVAL_MODE:-hybrid}
      - REED_RERANK_ENABLED=${REED_RERANK_ENABLED:-false}
      - REED_RERANK_BACKEND=${REED_RERANK_BACKEND:-sentence_transformers}
      - REED_RERANK_MODEL=${REED_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - REED_SPARSE_MODEL=${REED_SPARSE_MODEL:-Qdrant/bm25}
      - REED_MAX_CONTEXT_CHARS=${REED_MAX_CONTEXT_CHARS:-24000}
      - REED_MAX_CHUNKS_PER_DOCUMENT=${REED_MAX_CHUNKS_PER_DOCUMENT:-2}
      - REED_DIVERSITY_ENABLED=${REED_DIVERSITY_ENABLED:-true}
      - REED_DIVERSITY_LAMBDA=${REED_DIVERSITY_LAMBDA:-0.7}
      # Bare entry keeps the automatic model/mode-specific calibrated preset.
      - REED_MIN_EVIDENCE_SCORE
      - REED_CHUNK_SIZE=${REED_CHUNK_SIZE:-1000}
      - REED_CHUNK_OVERLAP=${REED_CHUNK_OVERLAP:-150}
      - REED_MAX_UPLOAD_MB=${REED_MAX_UPLOAD_MB:-25}
      - REED_MAX_MULTIPART_OVERHEAD_KB=${REED_MAX_MULTIPART_OVERHEAD_KB:-256}
      - REED_MAX_DOCUMENT_CHARS=${REED_MAX_DOCUMENT_CHARS:-5000000}
      - REED_MAX_PDF_PAGES=${REED_MAX_PDF_PAGES:-1000}
      - REED_PARSER_TIMEOUT_SECONDS=${REED_PARSER_TIMEOUT_SECONDS:-30}
      - REED_PARSER_CPU_SECONDS=${REED_PARSER_CPU_SECONDS:-20}
      - REED_PARSER_MEMORY_MB=${REED_PARSER_MEMORY_MB:-1024}
      - REED_DATA_DIR=/data
      - REED_HOST=0.0.0.0
      - REED_PORT=8000
      - REED_LOG_LEVEL=${REED_LOG_LEVEL:-INFO}
      - REED_TEMPERATURE=${REED_TEMPERATURE:-0.1}
      - REED_API_KEY=${REED_API_KEY:-}
      - REED_CORS_ORIGINS=${REED_CORS_ORIGINS:-}
      - REED_PROVIDER_TIMEOUT_SECONDS=${REED_PROVIDER_TIMEOUT_SECONDS:-120}
      - REED_STARTUP_GRACE_SECONDS=${REED_STARTUP_GRACE_SECONDS:-2}
      - REED_READINESS_RETRY_INITIAL_SECONDS=${REED_READINESS_RETRY_INITIAL_SECONDS:-2}
      - REED_READINESS_RETRY_MAX_SECONDS=${REED_READINESS_RETRY_MAX_SECONDS:-60}
      - REED_READINESS_CHAT_TTL_SECONDS=${REED_READINESS_CHAT_TTL_SECONDS:-15}
      - REED_READINESS_PROBE_TIMEOUT_SECONDS=${REED_READINESS_PROBE_TIMEOUT_SECONDS:-5}
      - REED_MAX_OUTPUT_TOKENS=${REED_MAX_OUTPUT_TOKENS:-1024}
      - REED_MAX_CONCURRENT_ASKS=${REED_MAX_CONCURRENT_ASKS:-8}
      - REED_MAX_CONCURRENT_SEARCHES=${REED_MAX_CONCURRENT_SEARCHES:-16}
      - REED_MAX_CONCURRENT_UPLOADS=${REED_MAX_CONCURRENT_UPLOADS:-4}
      - REED_MAX_CONCURRENT_INGESTIONS=${REED_MAX_CONCURRENT_INGESTIONS:-2}
      - REED_MAX_QUEUED_INGESTIONS=${REED_MAX_QUEUED_INGESTIONS:-16}
      - REED_ASK_RATE_LIMIT_PER_MINUTE=${REED_ASK_RATE_LIMIT_PER_MINUTE:-60}
      - REED_UPLOAD_RATE_LIMIT_PER_MINUTE=${REED_UPLOAD_RATE_LIMIT_PER_MINUTE:-20}
      - REED_SEARCH_RATE_LIMIT_PER_MINUTE=${REED_SEARCH_RATE_LIMIT_PER_MINUTE:-120}
      - REED_SSE_QUEUE_SIZE=${REED_SSE_QUEUE_SIZE:-64}
      - REED_MAX_JSON_BODY_KB=${REED_MAX_JSON_BODY_KB:-128}
      - REED_TMPFS_SIZE=${REED_TMPFS_SIZE:-256m}
      - REED_EVAL_JUDGE_PROFILE=${REED_EVAL_JUDGE_PROFILE:-openai}
      - REED_EVAL_JUDGE_MODEL=${REED_EVAL_JUDGE_MODEL:-}
    volumes:
      - reed_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # Starlette's upload spool and Reed's staged copy coexist for every
      # upload in flight, which REED_MAX_CONCURRENT_UPLOADS bounds.
      - /tmp:size=${REED_TMPFS_SIZE:-256m},mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no curl or wget — bash's /dev/tcp is what is available.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Fully local stack: `docker compose --profile ollama up`
  # Then pull the models once:
  #   docker compose exec ollama ollama pull qwen3.5:4b
  #   docker compose exec ollama ollama pull embeddinggemma
  ollama:
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  reed_data:
  qdrant_storage:
  ollama_models:
