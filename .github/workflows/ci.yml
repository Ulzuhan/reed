name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run mypy src tests

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.11+; this is what makes that claim true.
        python: ["3.11", "3.12", "3.13"]
    env:
      # No API keys in CI: the fake profile exercises every code path with
      # deterministic stand-in models.
      REED_PROFILE: fake
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Cache FastEmbed models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-${{ runner.os }}-bm25-v1
      # Explicit --python overrides .python-version, which pins 3.13 for local work.
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --group dev
      - run: uv run pip-audit

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [test, lint, types, security]
    env:
      REED_PROFILE: fake
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          # Same tag docker-compose.yml refers to, so compose uses this build
          # instead of pulling or rebuilding.
          tags: ghcr.io/ulzuhan/reed:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Upload a document and ask about it
        run: |
          set -euo pipefail
          printf '# Expenses\n\nExpenses above 75 euros require pre-approval.\n' > sample.md

          document_id=$(curl -sf -F file=@sample.md http://localhost:8000/v1/documents | jq -r .document_id)
          echo "uploaded ${document_id}"

          for _ in $(seq 30); do
            status=$(curl -sf "http://localhost:8000/v1/documents/${document_id}" | jq -r .status)
            [ "$status" = "ready" ] && break
            [ "$status" = "error" ] && { curl -s "http://localhost:8000/v1/documents/${document_id}"; exit 1; }
            sleep 2
          done
          [ "$status" = "ready" ] || { echo "ingestion never finished (last status: $status)"; exit 1; }

          answer=$(curl -sf -X POST http://localhost:8000/v1/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What is the expense threshold?","stream":false}')
          echo "$answer" | jq .
          echo "$answer" | jq -e '.sources | length > 0' > /dev/null
          echo "$answer" | jq -e '.answer | contains("[1]")' > /dev/null

      - name: Server logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
