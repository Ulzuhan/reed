name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      concurrency-scope:
        description: >-
          A value unique to the calling workflow. Inside a called workflow the
          github context belongs to the caller, so Release and Docker — both
          triggered by the same tag push — would otherwise share one group and
          cancel each other's quality gate.
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.concurrency-scope || 'pull-request' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: lint
      # The global UV_FROZEN would downgrade --check to a validity-only test.
      - run: env -u UV_FROZEN uv lock --check
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: types
      - run: uv sync --group dev
      - run: uv run mypy src tests

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.11+; this is what makes that claim true.
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # No API keys in CI: the fake profile exercises every code path with
      # deterministic stand-in models.
      REED_PROFILE: fake
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: tests-${{ matrix.python }}
          python-version: ${{ matrix.python }}
      - name: Cache FastEmbed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-${{ runner.os }}-bm25-v1
      # Explicit --python overrides .python-version, which pins 3.14 for local work.
      - run: uv sync --group dev --python ${{ matrix.python }}
      - name: Test
        if: matrix.python != '3.14'
        run: uv run --python ${{ matrix.python }} pytest
      - name: Test with coverage gate
        if: matrix.python == '3.14'
        run: >-
          uv run --python ${{ matrix.python }} pytest
          --cov=reed --cov-branch --cov-report=term-missing:skip-covered
          --cov-fail-under=85
      - name: Critical-module branch coverage gates
        if: matrix.python == '3.14'
        run: |
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/api/routes/ask.py' --fail-under=75
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/evals/judge.py' --fail-under=60
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/evals/runner.py' --fail-under=80
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/indexes.py' --fail-under=90
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/ingest/parser_worker.py' --fail-under=55
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/ingest/pipeline.py' --fail-under=78
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/ingest/registry.py' --fail-under=90
          uv run --python ${{ matrix.python }} coverage report --include='src/reed/rag/vectorstore.py' --fail-under=78

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    env:
      REED_PROFILE: fake
      # Job-level expressions cannot use the runner context. Each hosted
      # runner is ephemeral, so a fixed /tmp path is isolated for this job.
      REED_DATA_DIR: /tmp/reed-e2e-data
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: browser
          python-version: "3.14"
      - name: Cache FastEmbed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-${{ runner.os }}-bm25-v1
      - run: uv sync --group dev --group e2e --python 3.14
      - run: uv run playwright install --with-deps chromium
      - name: Start Reed
        run: |
          uv run reed serve > "${RUNNER_TEMP}/reed-e2e.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/reed-e2e.pid"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/reed-e2e.log"
          exit 1
      - name: Exercise the UI
        run: uv run pytest e2e --base-url http://127.0.0.1:8000
      - name: Server logs on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/reed-e2e.log"
      - name: Stop Reed
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/reed-e2e.pid")" || true

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: security
      - run: uv sync --group dev
      - run: uv run pip-audit
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [test, browser, lint, types, security]
    env:
      REED_PROFILE: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          # Same tag docker-compose.yml refers to, so compose uses this build
          # instead of pulling or rebuilding.
          tags: ghcr.io/ulzuhan/reed:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/ulzuhan/reed:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Upload a document and ask about it
        run: |
          set -euo pipefail
          printf '# Expenses\n\nExpenses above 75 euros require pre-approval.\n' > sample.md

          document_id=$(curl -sf -F file=@sample.md http://localhost:8000/v1/documents | jq -r .document_id)
          echo "uploaded ${document_id}"

          for _ in $(seq 30); do
            status=$(curl -sf "http://localhost:8000/v1/documents/${document_id}" | jq -r .status)
            [ "$status" = "ready" ] && break
            [ "$status" = "error" ] && { curl -s "http://localhost:8000/v1/documents/${document_id}"; exit 1; }
            sleep 2
          done
          [ "$status" = "ready" ] || { echo "ingestion never finished (last status: $status)"; exit 1; }

          answer=$(curl -sf -X POST http://localhost:8000/v1/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What is the expense threshold?","stream":false}')
          echo "$answer" | jq .
          echo "$answer" | jq -e '.sources | length > 0' > /dev/null
          echo "$answer" | jq -e '.answer | contains("[1]")' > /dev/null

      # The only place a remote Qdrant is exercised. Reindex, rollback and
      # backup all talk to it, and the embedded backend's exclusive storage
      # lock means none of this shape can be reached in the unit suite.
      - name: Exercise the index and backup lifecycle against remote Qdrant
        run: |
          set -euo pipefail
          # The runbook says to stop the server first, so the supported path is
          # what gets covered.
          docker compose stop api

          run() { docker compose run --rm -T api "$@"; }
          run reed index status
          run reed index reindex
          run reed index status | tee /tmp/after-reindex.txt
          grep -q '^active ' /tmp/after-reindex.txt
          grep -q '1 ready document' /tmp/after-reindex.txt

          # An archive has to land outside REED_DATA_DIR, and /tmp is tmpfs.
          run sh -c 'reed backup create /tmp/b.tar.gz && reed backup verify /tmp/b.tar.gz'

          run reed index rollback
          run reed index cleanup --keep 1

          docker compose up -d --wait api

      - name: Ask again, now that the index has been rebuilt and rolled back
        run: |
          set -euo pipefail
          answer=$(curl -sf -X POST http://localhost:8000/v1/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What is the expense threshold?","stream":false}')
          echo "$answer" | jq -e '.sources | length > 0' > /dev/null
          echo "$answer" | jq -e '.answer | contains("[1]")' > /dev/null

      # The restore path this covers is the one the runbook documents and the
      # only one downstream consumers run: into the named volume, as the
      # unprivileged container user, with a read-only root filesystem around
      # it. Nothing else in the repository exercises it.
      - name: Restore a backup into a fresh volume and serve from it
        run: |
          set -euo pipefail
          # The archive has to outlive the container that writes it, and /tmp
          # is a tmpfs in the shipped compose — so it goes to a bind mount.
          # World-writable because the image runs as an unprivileged user whose
          # uid does not match the runner's.
          mkdir -p "${PWD}/backup"
          chmod 777 "${PWD}/backup"

          docker compose stop api
          docker compose run --rm -T --no-deps --volume "${PWD}/backup:/backup" \
            api reed backup create /backup/reed-backup.tar.gz
          docker compose run --rm -T --no-deps --volume "${PWD}/backup:/backup:ro" \
            api reed backup verify /backup/reed-backup.tar.gz

          # Restore refuses a non-empty target, so the volumes are recreated
          # from scratch. REED_DATA_DIR is then a bare mountpoint whose parent
          # is the read-only rootfs — the shape that used to fail.
          docker compose down -v
          docker compose run --rm -T --no-deps --volume "${PWD}/backup:/backup:ro" \
            api reed backup restore /backup/reed-backup.tar.gz

          # The corpus and the registry came back from the archive; the vectors
          # went with the Qdrant volume, so they are rebuilt from the restored
          # uploads exactly as the disaster-recovery runbook prescribes.
          docker compose up -d --wait qdrant
          docker compose run --rm -T api reed index reindex
          docker compose up -d --wait

          curl -sf http://localhost:8000/v1/documents | jq -e '.documents | length == 1' > /dev/null
          answer=$(curl -sf -X POST http://localhost:8000/v1/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What is the expense threshold?","stream":false}')
          echo "$answer" | jq .
          echo "$answer" | jq -e '.sources | length > 0' > /dev/null
          echo "$answer" | jq -e '.answer | contains("[1]")' > /dev/null

      - name: Server logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
