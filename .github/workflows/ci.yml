name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # No API keys in CI: the fake profile exercises every code path with
      # deterministic stand-in models.
      REED_PROFILE: fake
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache FastEmbed models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-${{ runner.os }}-bm25-v1
      - run: uv sync --group dev
      - run: uv run pytest
