name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      concurrency-scope: release

  package:
    name: Build and attest package
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-suffix: release

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          REED_TAG_VERSION="${GITHUB_REF_NAME#v}"
          REED_PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${REED_PACKAGE_VERSION}"
          test "${REED_TAG_VERSION}" = "${REED_PACKAGE_VERSION}"
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build source distribution, then rebuild wheel from it
        shell: bash
        run: |
          set -euo pipefail
          REED_TAG_VERSION="${GITHUB_REF_NAME#v}"
          uv build --sdist --no-sources --out-dir dist
          uv build --wheel --no-sources "dist/reed-${REED_TAG_VERSION}.tar.gz" --out-dir dist

      - name: Verify source distribution contents
        shell: bash
        run: |
          set -euo pipefail
          REED_TAG_VERSION="${GITHUB_REF_NAME#v}"
          REED_SDIST="dist/reed-${REED_TAG_VERSION}.tar.gz"
          tar -tzf "${REED_SDIST}" > /tmp/reed-sdist-contents.txt
          grep -Fqx "reed-${REED_TAG_VERSION}/pyproject.toml" /tmp/reed-sdist-contents.txt
          grep -Fqx "reed-${REED_TAG_VERSION}/src/reed/__init__.py" /tmp/reed-sdist-contents.txt
          if grep -Eq '/(\.env|\.github|docs|e2e|tests)/' /tmp/reed-sdist-contents.txt; then
            echo "Development-only content leaked into the source distribution" >&2
            exit 1
          fi
          grep -Fqx "reed-${REED_TAG_VERSION}/src/reed/evals/data/golden.jsonl" /tmp/reed-sdist-contents.txt
          grep -Fqx "reed-${REED_TAG_VERSION}/LICENSE" /tmp/reed-sdist-contents.txt

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          REED_TAG_VERSION="${GITHUB_REF_NAME#v}"
          REED_WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${REED_WHEEL}"
          uv venv /tmp/reed-release-venv --python 3.14
          uv pip install --python /tmp/reed-release-venv/bin/python "${REED_WHEEL}"
          test "$(/tmp/reed-release-venv/bin/reed --version)" = "reed ${REED_TAG_VERSION}"
          mkdir /tmp/reed-empty-workdir
          cd /tmp/reed-empty-workdir
          REED_PROFILE=fake /tmp/reed-release-venv/bin/reed eval --retrieval-only --k 1

      - name: Prepare checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          REED_TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir release
          cp dist/*.whl dist/*.tar.gz release/
          (
            cd release
            sha256sum reed-*.whl reed-*.tar.gz > SHA256SUMS
          )
          awk -v header="## [${REED_TAG_VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz

      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reed-release
          path: release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reed-release
          path: release

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REED_TITLE="Reed ${GITHUB_REF_NAME#v}"
          REED_ASSETS=(release/reed-*.whl release/reed-*.tar.gz release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${REED_ASSETS[@]}" \
              --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --title "${REED_TITLE}" \
              --notes-file release/RELEASE_NOTES.md --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${REED_ASSETS[@]}" --verify-tag \
              --title "${REED_TITLE}" --notes-file release/RELEASE_NOTES.md --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
