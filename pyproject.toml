[project]
name = "reed"
version = "0.4.1"
description = "Self-hosted RAG service: upload documents, ask questions, get cited answers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "José Manuel Cotarelo Linares", email = "delvalle.linares@gmail.com" }]
keywords = ["rag", "llm", "langchain", "qdrant", "fastapi", "ollama", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.14",
    "python-multipart>=0.0.20",
    "langchain-core>=1.5,<2",
    "langchain-openai>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "qdrant-client[fastembed]>=1.18",
    "pypdf>=6.15",
    "python-docx>=1.1,<2",
    "selectolax>=0.4.11,<0.5",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=5.1,<6",
]

[project.urls]
Homepage = "https://github.com/Ulzuhan/reed"
Repository = "https://github.com/Ulzuhan/reed"
Issues = "https://github.com/Ulzuhan/reed/issues"

[project.scripts]
reed = "reed.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx2>=2.7",
    "ruff>=0.14",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest-cov>=6,<8",
]

e2e = [
    "pytest-playwright>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/reed",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
]

[tool.hatch.build.targets.sdist.force-include]
"src/reed/evals/data" = "src/reed/evals/data"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "BLE",  # no silent blanket excepts
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # function call in default arg — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "qdrant_client.*", "langchain_qdrant.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise the embedded Qdrant + real sparse embeddings",
    "e2e: browser tests that require a running Reed server",
]

[tool.coverage.run]
branch = true
source = ["reed"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
